services:
  - type: web
    name: mm-data-search
    runtime: static
    buildCommand: echo "Build complete at $(date)"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
